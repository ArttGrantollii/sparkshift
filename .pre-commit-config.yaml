repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: detect-private-key

  # Ruff runs from the project's own environment (pinned in uv.lock), so the
  # hook, CI, and your editor all use exactly the same Ruff version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        # --force-exclude: honor pyproject's excludes for files pre-commit
        # passes by name.
        entry: uv run --frozen ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format --force-exclude
        language: system
        # Markdown too: Ruff formats Python code blocks in docs, and CI checks them.
        types_or: [python, pyi, markdown]
