name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only access is all this workflow needs.
permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes only full version tags (no moving "v10" tag).
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest and newest supported versions.
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - run: uv sync --locked

      # Browser tests run in their own job, below; database tests skip here.
      - run: uv run pytest --cov -v -m "not browser"

  # The PostgreSQL scenarios run on a real PostgreSQL server, and its rows are
  # compared with the generated PySpark's on Spark. The server is a throwaway
  # container that lives only as long as this job, so it needs no password.
  postgres:
    name: PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SPARKSHIFT_POSTGRES_URL: postgresql://postgres@localhost:5432/postgres
      # Without the URL, fail instead of skipping (see tests/equivalence/test_postgres.py).
      SPARKSHIFT_DATABASE_REQUIRED: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run pytest -m database -v

  # The playground, built and driven in a real browser: every example must
  # convert exactly as on the command line.
  playground:
    name: Playground (browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run playwright install --with-deps chromium

      - run: uv run pytest -m browser -v

  # What users install is the built wheel, not this checkout: build it,
  # inspect it, and use it in an environment with nothing else installed.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Build the source distribution and wheel
        run: uv build

      - name: Check the wheel's dependencies and contents
        run: python3 tools/check_wheel.py dist/*.whl

      - name: Check the package description renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Install the wheel in a clean environment and use it
        run: |
          uv venv /tmp/clean
          uv pip install --python /tmp/clean dist/*.whl
          /tmp/clean/bin/sparkshift --version
          echo "SELECT name FROM customers WHERE country = 'US'" \
            | /tmp/clean/bin/sparkshift convert -
