[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sparkshift"
dynamic = ["version"]
description = "Convert SQL into readable, idiomatic, tested PySpark DataFrame code."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Art Grantolli" }]
keywords = ["pyspark", "spark", "sql", "transpiler", "migration", "data-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=30.21,<31",
]

[project.scripts]
sparkshift = "sparkshift.cli:main"

[project.urls]
Homepage = "https://github.com/ArttGrantollii/sparkshift"
Repository = "https://github.com/ArttGrantollii/sparkshift"
Issues = "https://github.com/ArttGrantollii/sparkshift/issues"
Changelog = "https://github.com/ArttGrantollii/sparkshift/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sparkshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkshift"]

[dependency-groups]
dev = [
    "playwright>=1.50",
    "pre-commit>=4.6.2",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # pyupgrade: modern Python syntax
    "B",   # flake8-bugbear: common bug patterns
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Test data is laid out as aligned tables, one row per line.
"tests/equivalence/datasets.py" = ["E501"]
# Generated code expects a SparkSession named `spark` to exist.
"examples/pyspark/**" = ["F821"]

[tool.ruff.format]
# Generated examples keep SparkShift's own layout, byte for byte; tests
# check them against the converter's output instead.
exclude = ["examples/pyspark/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "spark: starts a real local SparkSession (slower; requires Java)",
    "browser: drives the playground in headless Chromium (requires network)",
]

[tool.coverage.run]
source = ["sparkshift"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
