[build-system]
# hatch-fancy-pypi-readme rewrites the README's relative links for PyPI.
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=25.1"]
build-backend = "hatchling.build"

[project]
name = "sparkshift"
dynamic = ["version", "readme"]
description = "Convert SQL and SAS programs into readable, tested PySpark DataFrame code."
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Art Grantolli" }]
keywords = [
    "pyspark",
    "spark",
    "sql",
    "sas",
    "databricks",
    "transpiler",
    "migration",
    "data-engineering",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "sqlglot>=30.21,<31",
]

[project.optional-dependencies]
# sparkshift upload: import generated notebooks into a Databricks workspace.
databricks = ["databricks-sdk>=0.144,<1"]

[project.scripts]
sparkshift = "sparkshift.cli:main"

[project.urls]
Homepage = "https://github.com/ArttGrantollii/sparkshift"
Repository = "https://github.com/ArttGrantollii/sparkshift"
Issues = "https://github.com/ArttGrantollii/sparkshift/issues"
Changelog = "https://github.com/ArttGrantollii/sparkshift/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sparkshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkshift"]

# PyPI shows the README as the package description but cannot follow links
# into the repository, so relative links become links to GitHub there. On
# GitHub, the README keeps its relative links.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?![a-z]+:|#)([^)\s]+)\)'
replacement = '](https://github.com/ArttGrantollii/sparkshift/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/ArttGrantollii/sparkshift#\1)'

[dependency-groups]
dev = [
    "axe-playwright-python>=0.1.8",
    # The newest release at least two weeks old when it was added (the SDK
    # releases almost daily); the tests use its real types. Raise deliberately.
    "databricks-sdk>=0.144,<0.145",
    "playwright>=1.50",
    "pre-commit>=4.6.2",
    "psycopg[binary]>=3.3.6",
    "pymysql>=1.2.3",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
# The Spark Connect client, to test the generated code the way Databricks
# serverless compute runs it: uv sync --group connect, then run the tests with
# SPARKSHIFT_SPARK_MODE=connect.
connect = [
    # PySpark 4.2 warns that it does not fully support pandas 3 yet.
    "pandas>=2.2,<3",
    "pyspark[connect]>=4.2.0",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # pyupgrade: modern Python syntax
    "B",   # flake8-bugbear: common bug patterns
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# Test data is laid out as aligned tables, one row per line.
"tests/equivalence/datasets.py" = ["E501"]
# Generated code expects a SparkSession named `spark` to exist.
"examples/pyspark/**" = ["F821"]

[tool.ruff.format]
# Generated examples keep SparkShift's own layout, byte for byte; tests
# check them against the converter's output instead.
exclude = ["examples/pyspark/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "spark: starts a real local SparkSession (slower; requires Java)",
    "browser: drives the playground in headless Chromium (requires network)",
    "database: runs queries on a real database server (needs its connection URL)",
]

[tool.coverage.run]
source = ["sparkshift"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = false
