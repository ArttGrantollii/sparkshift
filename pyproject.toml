[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sparkshift"
dynamic = ["version"]
description = "Convert SQL into readable, idiomatic, tested PySpark DataFrame code."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Art Grantolli" }]
keywords = ["pyspark", "spark", "sql", "transpiler", "databricks", "data-engineering"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ArttGrantollii/sparkshift"
Repository = "https://github.com/ArttGrantollii/sparkshift"
Issues = "https://github.com/ArttGrantollii/sparkshift/issues"
Changelog = "https://github.com/ArttGrantollii/sparkshift/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/sparkshift/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sparkshift"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pyspark>=4.2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes: unused imports, undefined names
    "I",   # import sorting
    "UP",  # pyupgrade: modern Python syntax
    "B",   # flake8-bugbear: common bug patterns
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "spark: starts a real local SparkSession (slower; requires Java)",
]

[tool.coverage.run]
source = ["sparkshift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
